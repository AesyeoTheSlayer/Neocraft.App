<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="assets/js/construction-mode.js?v=1"></script>
  <title>Forum discussion — ZephyrCraft</title>
  <meta name="description" content="Read and reply to a ZephyrCraft community discussion.">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#0a0d12">
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
  <link rel="stylesheet" href="assets/css/font.css?v=25">
  <link rel="stylesheet" href="assets/css/style.css?v=51">
</head>
<body>
  <div data-site-header></div>
  <main id="main" class="content-page forum-page" data-forum-page="thread">
    <div class="wrap forum-shell forum-thread-shell">
      <nav class="forum-breadcrumb" aria-label="Breadcrumb"><a href="forums.html">Forums</a><span aria-hidden="true">/</span><a data-thread-category-link href="forum-category.html">Category</a><span aria-hidden="true">/</span><span>Discussion</span></nav>
      <article class="forum-topic" data-forum-topic aria-live="polite"></article>
      <section class="forum-replies" aria-labelledby="forum-replies-title">
        <div class="forum-replies__head"><h2 id="forum-replies-title"><span data-reply-count>0</span> replies</h2><a href="#reply">Reply to discussion</a></div>
        <div data-forum-replies></div>
      </section>
      <section class="forum-reply-box" id="reply">
        <span class="eyebrow eyebrow--diamond">Add a reply</span>
        <h2>Continue the discussion</h2>
        <form data-forum-reply-form>
          <label class="sr-only" for="reply-body">Your reply</label>
          <textarea class="textarea" id="reply-body" name="body" minlength="2" maxlength="8000" placeholder="Write a constructive reply…" required></textarea>
          <div class="forum-compose-foot"><span data-forum-reply-status role="status" aria-live="polite">Sign in to post a reply.</span><button class="btn btn--primary" type="submit">Post reply</button></div>
        </form>
      </section>
    </div>
  </main>
  <div data-site-footer></div>
  <script src="assets/js/main.js?v=16"></script>
  <script src="assets/js/neocraft-config.js?v=1"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3/dist/umd/supabase.min.js" integrity="sha384-l8ah+VgaWtk1mvOe9VC+OirC6qHFF4yH7l7mKRidV9MSti3E9F463bMp6ZVN4kuC" crossorigin="anonymous"></script>
  <script src="assets/js/auth-core.js?v=1"></script>
  <script src="assets/js/forum.js?v=3"></script>
</body>
</html>
